<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cvassure / integrity console</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <a class="brand" href="#/overview"
            ><span class="brand-mark">+</span><span class="brand-word">cvassure</span></a
          >
          <button class="sidebar-toggle" id="sidebarToggle" title="Collapse menu" aria-label="Collapse menu">
            «
          </button>
        </div>
        <nav class="sidebar-nav" id="sidebarNav" aria-label="Modules"></nav>
        <div class="sidebar-foot">
          <span class="live-dot"></span><span class="sidebar-foot-text">OFFLINE — nothing leaves this machine</span>
        </div>
      </aside>

      <div class="main">
        <header class="module-topbar" id="moduleTopbar">
          <div class="module-heading">
            <p class="eyebrow" id="moduleEyebrow">Module</p>
            <h1 id="moduleTitle">Overview</h1>
          </div>
          <nav class="module-tabs" id="moduleTabs" aria-label="Section"></nav>
        </header>
        <main class="module-content" id="moduleContent"></main>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>
    <template id="tpl-upload-field">
      <label class="upload-field">
        <span class="upload-field-label"></span>
        <input type="file" />
        <span class="upload-field-hint"></span>
      </label>
    </template>
    <script src="app.js"></script>
  </body>
</html>
